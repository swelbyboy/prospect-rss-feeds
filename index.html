<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prospect RSS Feeds</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            max-width: 1200px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 30px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .success {
            color: green;
        }
        .failed {
            color: red;
        }
    </style>
</head>
<body>
    <h1>Prospect RSS Feeds</h1>
    <h2>Current Prospects</h2>
    <table>
        <tr>
            <th>Prospect Name</th>
            <th>RSS Feed</th>
            <th>Data Source</th>
            <th>Last Scrape Status</th>
            <th>Last Scrape Timestamp</th>
        </tr>
    </table>
    <p>Last updated: 2025-12-04 14:40:08 UTC</p>
</body>
</html>
