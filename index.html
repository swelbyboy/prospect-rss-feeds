<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prospect RSS Feeds</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 {
            color: #333;
            border-bottom: 3px solid #007bff;
            padding-bottom: 10px;
        }
        .feed-list {
            list-style: none;
            padding: 0;
        }
        .feed-item {
            background: #f8f9fa;
            margin: 10px 0;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #007bff;
        }
        .feed-item a {
            color: #007bff;
            text-decoration: none;
            font-weight: 500;
        }
        .feed-item a:hover {
            text-decoration: underline;
        }
        .timestamp {
            color: #6c757d;
            font-size: 0.9em;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>🔗 Prospect RSS Feeds</h1>
    <p>Available RSS feeds for prospect articles:</p>
    <ul class="feed-list">
        <li class="feed-item">
            <strong>Knowtechie</strong><br>
            <a href="knowtechie.xml">https://swelbyboy.github.io/prospect-rss-feeds/knowtechie.xml</a>
        </li>
        <li class="feed-item">
            <strong>The Nerd Stash</strong><br>
            <a href="the-nerd-stash.xml">https://swelbyboy.github.io/prospect-rss-feeds/the-nerd-stash.xml</a>
        </li>
    </ul>
    <p class="timestamp">Last updated: 2025-11-03 19:01:45 UTC</p>
</body>
</html>
