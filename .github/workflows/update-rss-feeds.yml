name: Update RSS Feeds

on:
  # Run daily at 6 AM UTC (to catch new articles)
  schedule:
    - cron: '0 6 * * *'

  # Allow manual triggering from GitHub Actions tab
  workflow_dispatch:

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Update RSS feeds with batch processing
        env:
          GITHUB_CI: 'true'
          BATCH_SIZE: '500'  # Process 500 prospects per run
          SKIP_OG_DATA: 'true'  # Skip OG data fetching for faster updates
        run: |
          python3 << 'EOF'
          import csv
          import os
          from datetime import datetime
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from threading import Lock
          from rss_transformer import RSSTransformer
          from rss_generator import RSSFeedGenerator
          from config import Config

          print("🚀 Starting RSS Feed Update (Batched & Parallel)")
          print("=" * 80)

          # Configuration
          BATCH_SIZE = int(os.getenv('BATCH_SIZE', '500'))
          SKIP_OG_DATA = os.getenv('SKIP_OG_DATA', 'true').lower() == 'true'
          NUM_WORKERS = 20  # Parallel workers

          print(f"⚙️  Batch size: {BATCH_SIZE}")
          print(f"⚙️  Skip OG data: {SKIP_OG_DATA}")
          print(f"⚙️  Parallel workers: {NUM_WORKERS}")

          # Read prospects.csv
          all_prospects = []
          with open('prospects.csv', 'r', encoding='utf-8') as f:
              reader = csv.DictReader(f)
              for row in reader:
                  if row.get('rss_feed', '').strip():
                      all_prospects.append(row)

          total_prospects = len(all_prospects)
          print(f"📋 Found {total_prospects} total prospects with RSS feeds")
          print(f"📦 Processing in batches of {BATCH_SIZE}\n")

          # Shared resources
          transformer = RSSTransformer()
          if SKIP_OG_DATA:
              transformer._skip_og_data = True  # Flag to skip OG data

          generator = RSSFeedGenerator()
          base_url = Config.get_rss_base_url()

          all_tracking_data = []
          overall_successful = 0
          overall_failed = 0

          # Process all prospects in batches
          import time
          overall_start = time.time()

          def process_prospect(prospect, index, total, transformer, generator, base_url, print_lock):
              """Process a single prospect (thread-safe)."""
              company_name = prospect.get('company_name', 'Unknown')
              domain = prospect.get('domain', '')
              rss_feed = prospect.get('rss_feed', '').strip()
              prospect_id = prospect.get('id', '')

              try:
                  # Fetch and normalize
                  success, articles, error = transformer.fetch_and_normalize(rss_feed, max_articles=10)

                  if not success:
                      with print_lock:
                          print(f"[{index}/{total}] ❌ {company_name}: {error}")
                      return {
                          'prospect_id': prospect_id,
                          'company_name': company_name,
                          'domain': domain,
                          'last_scrape_date': datetime.now().strftime('%Y-%m-%d %H:%M:%S'),
                          'status': 'failed',
                          'articles_found': '0',
                          'rss_url': '',
                          'error_message': error,
                          'data_source': 'N/A'
                      }

                  # Determine data source
                  og_count = sum(1 for a in articles if a.get('data_source') == 'OG')
                  rss_count = len(articles) - og_count

                  if og_count > 0 and rss_count > 0:
                      data_source = f"OG ({og_count}), RSS ({rss_count})"
                  elif og_count > 0:
                      data_source = "OG"
                  else:
                      data_source = "RSS"

                  # Generate feed
                  normalized_articles = [{
                      'link': a['link'],
                      'title': a['title'],
                      'description': a['description'],
                      'image_url': a.get('image_url'),
                      'published_date': a['pub_date']
                  } for a in articles]

                  prospect_data = {
                      'id': prospect_id,
                      'company_name': company_name,
                      'domain': domain
                  }

                  feed_path = generator.create_feed(prospect_data, normalized_articles)
                  feed_filename = os.path.basename(feed_path)

                  with print_lock:
                      print(f"[{index}/{total}] ✅ {company_name}: {len(articles)} articles")

                  return {
                      'prospect_id': prospect_id,
                      'company_name': company_name,
                      'domain': domain,
                      'last_scrape_date': datetime.now().strftime('%Y-%m-%d %H:%M:%S'),
                      'status': 'success',
                      'articles_found': str(len(articles)),
                      'rss_url': f"{base_url}/{feed_filename}",
                      'error_message': '',
                      'data_source': data_source
                  }

              except Exception as e:
                  with print_lock:
                      print(f"[{index}/{total}] ❌ {company_name}: {str(e)}")
                  return {
                      'prospect_id': prospect_id,
                      'company_name': company_name,
                      'domain': domain,
                      'last_scrape_date': datetime.now().strftime('%Y-%m-%d %H:%M:%S'),
                      'status': 'failed',
                      'articles_found': '0',
                      'rss_url': '',
                      'error_message': str(e),
                      'data_source': 'N/A'
                  }

          num_batches = (total_prospects + BATCH_SIZE - 1) // BATCH_SIZE
          for batch_num in range(num_batches):
              start_idx = batch_num * BATCH_SIZE
              end_idx = min(start_idx + BATCH_SIZE, total_prospects)
              batch_prospects = all_prospects[start_idx:end_idx]

              print(f"\n{'='*80}")
              print(f"📦 BATCH {batch_num + 1}/{num_batches}: Processing prospects {start_idx + 1}-{end_idx}")
              print(f"{'='*80}\n")

              tracking_data = []
              tracking_lock = Lock()
              print_lock = Lock()
              successful = 0
              failed = 0

              batch_start = time.time()

              # Process batch in parallel
              with ThreadPoolExecutor(max_workers=NUM_WORKERS) as executor:
                  futures = {
                      executor.submit(process_prospect, prospect, start_idx + i, total_prospects, transformer, generator, base_url, print_lock): prospect
                      for i, prospect in enumerate(batch_prospects, 1)
                  }

                  for future in as_completed(futures):
                      result = future.result()
                      with tracking_lock:
                          tracking_data.append(result)
                          if result['status'] == 'success':
                              successful += 1
                          else:
                              failed += 1

              batch_elapsed = time.time() - batch_start

              # Add batch results to overall tracking
              all_tracking_data.extend(tracking_data)
              overall_successful += successful
              overall_failed += failed

              print(f"\n{'='*80}")
              print(f"📊 BATCH {batch_num + 1} SUMMARY")
              print(f"{'='*80}")
              print(f"Batch prospects processed: {len(tracking_data)}")
              print(f"✅ Successful: {successful}")
              print(f"❌ Failed: {failed}")
              print(f"⏱️  Batch time: {batch_elapsed:.1f}s")
              print(f"⚡ Rate: {len(tracking_data)/batch_elapsed:.2f} prospects/sec")
              print(f"{'='*80}")

          # End of batch loop - print overall summary
          overall_elapsed = time.time() - overall_start

          print("\n" + "=" * 80)
          print("📊 OVERALL PROCESSING SUMMARY")
          print("=" * 80)
          print(f"Total prospects processed: {len(all_tracking_data)}")
          print(f"✅ Successful: {overall_successful}")
          print(f"❌ Failed: {overall_failed}")
          print(f"⏱️  Total time: {overall_elapsed/60:.1f} minutes ({overall_elapsed:.0f} seconds)")
          print(f"⚡ Average rate: {len(all_tracking_data)/overall_elapsed:.2f} prospects/sec")
          print("=" * 80)

          # Write tracking.csv
          with open('tracking.csv', 'w', encoding='utf-8', newline='') as f:
              fieldnames = ['prospect_id', 'company_name', 'domain', 'last_scrape_date', 'status', 'articles_found', 'rss_url', 'error_message', 'data_source']
              writer = csv.DictWriter(f, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(all_tracking_data)

          print(f"\n✅ Updated tracking.csv with {len(all_tracking_data)} entries")
          EOF

      - name: Commit updated feeds and tracking
        run: |
          git add feeds/*.xml tracking.csv
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update RSS feeds - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git pull --rebase origin main
            git push
          fi

      - name: Clone GitHub Pages repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/swelbyboy/prospect-rss-feeds.git github-pages-repo

      - name: Copy feeds to GitHub Pages
        run: |
          # Copy XML feeds to root of GitHub Pages repo (not in feeds/ subdirectory)
          cp feeds/*.xml github-pages-repo/
          
          # Create .nojekyll to disable Jekyll processing
          touch github-pages-repo/.nojekyll

          # Generate index.html with tracking data
          python3 << 'EOF'
          import csv
          from datetime import datetime
          from config import Config

          # Read tracking data
          tracking_data = []
          with open('tracking.csv', 'r', encoding='utf-8') as f:
              reader = csv.DictReader(f)
              tracking_data = list(reader)

          base_url = Config.get_rss_base_url()

          html_content = """<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Prospect RSS Feeds</title>
              <style>
                  body {
                      font-family: Arial, sans-serif;
                      margin: 20px;
                      max-width: 1200px;
                  }
                  table {
                      border-collapse: collapse;
                      width: 100%;
                      margin-bottom: 30px;
                  }
                  th, td {
                      border: 1px solid #ddd;
                      padding: 8px;
                      text-align: left;
                  }
                  th {
                      background-color: #f2f2f2;
                  }
                  .success {
                      color: green;
                  }
                  .failed {
                      color: red;
                  }
              </style>
          </head>
          <body>
              <h1>Prospect RSS Feeds</h1>
              <h2>Current Prospects</h2>
              <table>
                  <tr>
                      <th>Prospect Name</th>
                      <th>RSS Feed</th>
                      <th>Data Source</th>
                      <th>Last Scrape Status</th>
                      <th>Last Scrape Timestamp</th>
                  </tr>
          """

          for entry in tracking_data:
              company_name = entry.get('company_name', '')
              status = entry.get('status', '')
              rss_url = entry.get('rss_url', '')
              last_scrape_date = entry.get('last_scrape_date', '-')
              data_source = entry.get('data_source', 'RSS')

              status_class = 'success' if status == 'success' else 'failed'

              if rss_url:
                  rss_link = f'<a href="{rss_url}">{rss_url}</a>'
              else:
                  rss_link = '-'

              html_content += f"""        <tr>
              <td>{company_name}</td>
              <td>{rss_link}</td>
              <td>{data_source}</td>
              <td class="{status_class}">{status}</td>
              <td>{last_scrape_date}</td>
          </tr>
          """

          html_content += f"""    </table>
              <p>Last updated: {datetime.now().strftime('%Y-%m-%d %H:%M:%S UTC')}</p>
          </body>
          </html>
          """

          with open('github-pages-repo/index.html', 'w', encoding='utf-8') as f:
              f.write(html_content)

          print("✅ Generated index.html")
          EOF

      - name: Publish to GitHub Pages
        run: |
          cd github-pages-repo
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Update RSS feeds - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git pull --rebase origin main
            git push
            echo "✅ Published to GitHub Pages"
          fi
