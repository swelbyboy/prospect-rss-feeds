name: Update RSS Feeds

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Update RSS feeds
        env:
          GITHUB_CI: 'true'
          BATCH_SIZE: '500'
          SKIP_OG_DATA: 'true'
        run: |
          python3 << 'EOF'
          import csv
          import os
          import sys
          import time
          from datetime import datetime
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from threading import Lock

          sys.path.insert(0, 'scripts')
          from rss_transformer import RSSTransformer
          from rss_generator import RSSFeedGenerator
          from config import Config

          # Explicit paths relative to repo root (CWD in GitHub Actions)
          PROSPECTS_CSV = 'prospects/prospects.csv'
          TRACKING_CSV = 'prospects/tracking.csv'

          print("🚀 Starting RSS Feed Update")
          print("=" * 80)

          BATCH_SIZE = int(os.getenv('BATCH_SIZE', '500'))
          SKIP_OG_DATA = os.getenv('SKIP_OG_DATA', 'true').lower() == 'true'
          NUM_WORKERS = 20

          all_prospects = []
          with open(PROSPECTS_CSV, 'r', encoding='utf-8') as f:
              reader = csv.DictReader(f)
              for row in reader:
                  if row.get('rss_feed', '').strip():
                      all_prospects.append(row)

          total_prospects = len(all_prospects)
          print(f"📋 Found {total_prospects} prospects with RSS feeds")

          transformer = RSSTransformer()
          if SKIP_OG_DATA:
              transformer._skip_og_data = True

          generator = RSSFeedGenerator()
          base_url = Config.get_rss_base_url()

          all_tracking_data = []
          overall_successful = 0
          overall_failed = 0
          overall_start = time.time()

          def process_prospect(prospect, index, total, transformer, generator, base_url, print_lock):
              company_name = prospect.get('company_name', 'Unknown')
              domain = prospect.get('domain', '')
              rss_feed = prospect.get('rss_feed', '').strip()
              prospect_id = prospect.get('id', '')

              try:
                  success, articles, error = transformer.fetch_and_normalize(rss_feed, max_articles=10)

                  if not success:
                      with print_lock:
                          print(f"[{index}/{total}] ❌ {company_name}: {error}")
                      return {
                          'prospect_id': prospect_id, 'company_name': company_name,
                          'domain': domain, 'last_scrape_date': datetime.now().strftime('%Y-%m-%d %H:%M:%S'),
                          'status': 'failed', 'articles_found': '0', 'rss_url': '',
                          'error_message': error, 'data_source': 'N/A'
                      }

                  og_count = sum(1 for a in articles if a.get('data_source') == 'OG')
                  rss_count = len(articles) - og_count
                  data_source = f"OG ({og_count}), RSS ({rss_count})" if og_count and rss_count else ("OG" if og_count else "RSS")

                  normalized_articles = [{
                      'link': a['link'], 'title': a['title'], 'description': a['description'],
                      'image_url': a.get('image_url'), 'published_date': a['pub_date']
                  } for a in articles]

                  feed_path = generator.create_feed(
                      {'id': prospect_id, 'company_name': company_name, 'domain': domain},
                      normalized_articles
                  )
                  feed_filename = os.path.basename(feed_path)

                  with print_lock:
                      print(f"[{index}/{total}] ✅ {company_name}: {len(articles)} articles")

                  return {
                      'prospect_id': prospect_id, 'company_name': company_name,
                      'domain': domain, 'last_scrape_date': datetime.now().strftime('%Y-%m-%d %H:%M:%S'),
                      'status': 'success', 'articles_found': str(len(articles)),
                      'rss_url': f"{base_url}/{feed_filename}", 'error_message': '', 'data_source': data_source
                  }

              except Exception as e:
                  with print_lock:
                      print(f"[{index}/{total}] ❌ {company_name}: {str(e)}")
                  return {
                      'prospect_id': prospect_id, 'company_name': company_name,
                      'domain': domain, 'last_scrape_date': datetime.now().strftime('%Y-%m-%d %H:%M:%S'),
                      'status': 'failed', 'articles_found': '0', 'rss_url': '',
                      'error_message': str(e), 'data_source': 'N/A'
                  }

          num_batches = (total_prospects + BATCH_SIZE - 1) // BATCH_SIZE
          for batch_num in range(num_batches):
              start_idx = batch_num * BATCH_SIZE
              end_idx = min(start_idx + BATCH_SIZE, total_prospects)
              batch_prospects = all_prospects[start_idx:end_idx]

              print(f"\n📦 BATCH {batch_num + 1}/{num_batches}: prospects {start_idx + 1}-{end_idx}")

              tracking_data = []
              tracking_lock = Lock()
              print_lock = Lock()
              successful = 0
              failed = 0

              with ThreadPoolExecutor(max_workers=NUM_WORKERS) as executor:
                  futures = {
                      executor.submit(process_prospect, p, start_idx + i, total_prospects, transformer, generator, base_url, print_lock): p
                      for i, p in enumerate(batch_prospects, 1)
                  }
                  for future in as_completed(futures):
                      result = future.result()
                      with tracking_lock:
                          tracking_data.append(result)
                          if result['status'] == 'success':
                              successful += 1
                          else:
                              failed += 1

              all_tracking_data.extend(tracking_data)
              overall_successful += successful
              overall_failed += failed
              print(f"Batch {batch_num + 1}: ✅ {successful} succeeded, ❌ {failed} failed")

          overall_elapsed = time.time() - overall_start
          print(f"\n✅ Done: {overall_successful} succeeded, {overall_failed} failed in {overall_elapsed/60:.1f}m")

          with open(TRACKING_CSV, 'w', encoding='utf-8', newline='') as f:
              fieldnames = ['prospect_id', 'company_name', 'domain', 'last_scrape_date',
                            'status', 'articles_found', 'rss_url', 'error_message', 'data_source']
              writer = csv.DictWriter(f, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(all_tracking_data)

          print(f"✅ Updated {TRACKING_CSV} with {len(all_tracking_data)} entries")
          EOF

      - name: Commit tracking data to main
        run: |
          git add prospects/tracking.csv
          if git diff --staged --quiet; then
            echo "No tracking changes to commit"
          else
            git commit -m "Update RSS feeds - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git stash --include-untracked
            git pull --rebase origin main
            git push
            git stash pop || true
          fi

      - name: Publish feeds to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Set up gh-pages branch in a worktree
          git fetch origin gh-pages 2>/dev/null || true

          if git ls-remote --exit-code origin gh-pages > /dev/null 2>&1; then
            git worktree add gh-pages-dir origin/gh-pages
          else
            # Create orphan gh-pages branch
            git worktree add --orphan -b gh-pages gh-pages-dir
          fi

          # Copy XML feeds to gh-pages root
          if ls feeds/*.xml 1>/dev/null 2>&1; then
            cp feeds/*.xml gh-pages-dir/
            echo "Copied $(ls feeds/*.xml | wc -l) XML files"
          else
            echo "No XML files generated"
          fi

          # Create .nojekyll
          touch gh-pages-dir/.nojekyll

          # Generate index.html
          python3 << 'EOF'
          import csv, os, sys
          sys.path.insert(0, 'scripts')
          from config import Config
          from datetime import datetime

          tracking_data = []
          try:
              with open('prospects/tracking.csv', 'r', encoding='utf-8') as f:
                  tracking_data = list(csv.DictReader(f))
          except FileNotFoundError:
              pass

          base_url = Config.get_rss_base_url()

          rows = ""
          for entry in tracking_data:
              company_name = entry.get('company_name', '')
              status = entry.get('status', '')
              rss_url = entry.get('rss_url', '')
              last_scrape_date = entry.get('last_scrape_date', '-')
              data_source = entry.get('data_source', 'RSS')
              status_class = 'success' if status == 'success' else 'failed'
              rss_link = f'<a href="{rss_url}">{rss_url}</a>' if rss_url else '-'
              rows += f"<tr><td>{company_name}</td><td>{rss_link}</td><td>{data_source}</td><td class='{status_class}'>{status}</td><td>{last_scrape_date}</td></tr>\n"

          html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>Prospect RSS Feeds</title>
            <style>
              body {{ font-family: Arial, sans-serif; margin: 20px; max-width: 1200px; }}
              table {{ border-collapse: collapse; width: 100%; }}
              th, td {{ border: 1px solid #ddd; padding: 8px; text-align: left; }}
              th {{ background-color: #f2f2f2; }}
              .success {{ color: green; }} .failed {{ color: red; }}
            </style>
          </head>
          <body>
            <h1>Prospect RSS Feeds</h1>
            <p>Total: {len(tracking_data)} | Last updated: {datetime.now().strftime('%Y-%m-%d %H:%M:%S UTC')}</p>
            <table>
              <tr><th>Prospect</th><th>RSS Feed</th><th>Data Source</th><th>Status</th><th>Last Scraped</th></tr>
              {rows}
            </table>
          </body>
          </html>"""

          with open('gh-pages-dir/index.html', 'w', encoding='utf-8') as f:
              f.write(html)
          print("✅ Generated index.html")
          EOF

          # Commit and push gh-pages
          cd gh-pages-dir
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Deploy feeds to GitHub Pages - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push origin gh-pages
            echo "✅ Published to gh-pages branch"
          fi
