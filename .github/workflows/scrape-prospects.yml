name: Scrape Prospect Articles

on:
  # Run weekly on Sunday at 10 PM UTC (ready for Monday morning outreach)
  schedule:
    - cron: '0 22 * * 0'

  # Allow manual triggering from GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Verify Firecrawl API key
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          if [ -z "$FIRECRAWL_API_KEY" ]; then
            echo "❌ Error: FIRECRAWL_API_KEY secret is not set in repository settings"
            echo ""
            echo "To fix this:"
            echo "1. Go to: https://github.com/swelbyboy/prospect-rss-feeds/settings/secrets/actions"
            echo "2. Click 'New repository secret'"
            echo "3. Name: FIRECRAWL_API_KEY"
            echo "4. Value: Your Firecrawl API key"
            echo "5. Click 'Add secret'"
            exit 1
          else
            echo "✅ FIRECRAWL_API_KEY secret is set"
          fi

      - name: Run scraper
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GITHUB_CI: "true"
          MAX_ARTICLES_PER_PROSPECT: 10
          SCRAPING_TIMEOUT: 60
          PROSPECTS_CSV: "outreach_progress_tracker.csv"
        run: |
          python scraper.py

      - name: Generate index page
        run: |
          python generate_index.py

      - name: Update tracker with scraping results
        run: |
          python establish_tracker_truth.py

      - name: Commit and push changes
        run: |
          git add outreach_progress_tracker.csv tracking.csv current_feeds.txt index.html feeds/*.xml || true
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "Update scraping results - $(date -u '+%Y-%m-%d %H:%M:%S UTC')" && \
             git pull --rebase origin main && \
             git push)

      - name: Deploy feeds to GitHub Pages
        run: |
          # Copy XML feeds to root level for GitHub Pages serving
          echo "📤 Deploying feeds to GitHub Pages..."
          
          # Count feeds to deploy
          feed_count=$(ls feeds/*.xml 2>/dev/null | wc -l)
          echo "   Found $feed_count feeds to deploy"
          
          if [ "$feed_count" -gt 0 ]; then
            # Copy feeds to root (GitHub Pages serves from root)
            cp feeds/*.xml . || true
            
            # Create .nojekyll to disable Jekyll processing
            touch .nojekyll
            
            # Add and commit
            git add *.xml .nojekyll || true
            git diff --staged --quiet || \
              (git commit -m "Deploy feeds to GitHub Pages - $(date -u '+%Y-%m-%d %H:%M:%S UTC')" && \
               git pull --rebase origin main && \
               git push)
            
            echo "✅ Feeds deployed to GitHub Pages"
          else
            echo "⚠️  No feeds to deploy"
          fi
