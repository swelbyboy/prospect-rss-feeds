name: Scrape Prospect Articles

on:
  # Run daily at 2 AM UTC
  schedule:
    - cron: '0 2 * * *'

  # Allow manual triggering from GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Verify Firecrawl API key
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          if [ -z "$FIRECRAWL_API_KEY" ]; then
            echo "❌ Error: FIRECRAWL_API_KEY secret is not set in repository settings"
            echo ""
            echo "To fix this:"
            echo "1. Go to: https://github.com/swelbyboy/prospect-rss-feeds/settings/secrets/actions"
            echo "2. Click 'New repository secret'"
            echo "3. Name: FIRECRAWL_API_KEY"
            echo "4. Value: Your Firecrawl API key"
            echo "5. Click 'Add secret'"
            exit 1
          else
            echo "✅ FIRECRAWL_API_KEY secret is set"
          fi

      - name: Run scraper
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GITHUB_CI: "true"
          MAX_ARTICLES_PER_PROSPECT: 10
          SCRAPING_TIMEOUT: 60
        run: |
          python scraper.py

      - name: Generate index page
        run: |
          python -c "
          import csv
          from datetime import datetime

          # Read tracking data
          tracking_data = []
          try:
              with open('tracking.csv', 'r', encoding='utf-8') as f:
                  reader = csv.DictReader(f)
                  tracking_data = list(reader)
          except FileNotFoundError:
              pass

          # Generate index.html
          html = '''<!DOCTYPE html>
          <html lang=\"en\">
          <head>
              <meta charset=\"UTF-8\">
              <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
              <title>Prospect RSS Feeds</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 20px; max-width: 1200px; }
                  table { border-collapse: collapse; width: 100%; margin-bottom: 30px; }
                  th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
                  th { background-color: #f2f2f2; }
                  .success { color: green; }
                  .failed { color: red; }
                  .add-prospect-form {
                      background-color: #f9f9f9;
                      padding: 20px;
                      border-radius: 8px;
                      margin-bottom: 30px;
                      border: 1px solid #ddd;
                  }
                  .add-prospect-form h2 {
                      margin-top: 0;
                  }
                  .form-group {
                      margin-bottom: 15px;
                  }
                  .form-group label {
                      display: block;
                      margin-bottom: 5px;
                      font-weight: bold;
                  }
                  .form-group input {
                      width: 100%;
                      padding: 8px;
                      border: 1px solid #ddd;
                      border-radius: 4px;
                      box-sizing: border-box;
                      max-width: 500px;
                  }
                  .form-group input[type=\"submit\"] {
                      background-color: #28a745;
                      color: white;
                      border: none;
                      padding: 10px 20px;
                      cursor: pointer;
                      font-size: 16px;
                      max-width: 200px;
                  }
                  .form-group input[type=\"submit\"]:hover {
                      background-color: #218838;
                  }
                  .form-help {
                      font-size: 12px;
                      color: #666;
                      margin-top: 5px;
                  }
                  .success-message {
                      background-color: #d4edda;
                      color: #155724;
                      padding: 10px;
                      border-radius: 4px;
                      margin-top: 10px;
                      display: none;
                  }
                  .error-message {
                      background-color: #f8d7da;
                      color: #721c24;
                      padding: 10px;
                      border-radius: 4px;
                      margin-top: 10px;
                      display: none;
                  }
              </style>
          </head>
          <body>
              <h1>Prospect RSS Feeds</h1>
              
              <div class=\"add-prospect-form\">
                  <h2>➕ Add New Prospect</h2>
                  <form id=\"prospectForm\" onsubmit=\"submitProspect(event)\">
                      <div class=\"form-group\">
                          <label for=\"company_name\">Company Name:</label>
                          <input type=\"text\" id=\"company_name\" name=\"company_name\" required>
                          <div class=\"form-help\">Enter the company name (e.g., TechCorp)</div>
                      </div>
                      <div class=\"form-group\">
                          <label for=\"domain\">Domain:</label>
                          <input type=\"text\" id=\"domain\" name=\"domain\" required placeholder=\"example.com\">
                          <div class=\"form-help\">Enter the website domain without http:// or https:// (e.g., techcorp.com)</div>
                      </div>
                      <div class=\"form-group\">
                          <input type=\"submit\" value=\"Add Prospect\">
                      </div>
                      <div id=\"successMessage\" class=\"success-message\"></div>
                      <div id=\"errorMessage\" class=\"error-message\"></div>
                  </form>
              </div>

              <h2>Current Prospects</h2>
              <table>
                  <tr>
                      <th>Prospect Name</th>
                      <th>RSS Feed</th>
                      <th>Last Scrape Status</th>
                      <th>Last Scrape Timestamp</th>
                  </tr>
          '''

          for entry in tracking_data:
              company_name = entry.get('company_name', '')
              status = entry.get('status', '')
              rss_url = entry.get('rss_url', '')
              last_scrape_date = entry.get('last_scrape_date', '-')
              status_class = 'success' if status == 'success' else 'failed'
              rss_link = f'<a href=\"{rss_url}\">{rss_url}</a>' if rss_url else '-'
              html += f'        <tr><td>{company_name}</td><td>{rss_link}</td><td class=\"{status_class}\">{status}</td><td>{last_scrape_date}</td></tr>\n'

          html += f'''    </table>
              <p>Last updated: {datetime.now().strftime('%Y-%m-%d %H:%M:%S UTC')}</p>
              
              <script>
              function submitProspect(event) {{
                  event.preventDefault();
                  const form = event.target;
                  const companyName = document.getElementById('company_name').value.trim();
                  const domain = document.getElementById('domain').value.trim();
                  
                  // Clean domain (remove http://, https://, www.)
                  let cleanDomain = domain.replace(/^https?:\\/\\//, '').replace(/^www\\./, '').split('/')[0];
                  
                  // Create GitHub issue URL
                  const repoOwner = 'swelbyboy';
                  const repoName = 'prospect-rss-feeds';
                  const issueTitle = encodeURIComponent(`Add prospect: ${{companyName}}`);
                  const issueBody = encodeURIComponent(`**Company Name:** ${{companyName}}\\n\\n**Domain:** ${{cleanDomain}}\\n\\n<!-- This issue will be automatically processed and closed -->`);
                  const issueUrl = `https://github.com/${{repoOwner}}/${{repoName}}/issues/new?title=${{issueTitle}}&body=${{issueBody}}&labels=new-prospect`;
                  
                  // Open in new window
                  window.open(issueUrl, '_blank');
                  
                  // Show success message
                  const successMsg = document.getElementById('successMessage');
                  successMsg.textContent = '✅ Opening GitHub to create issue. After you submit the issue, it will be automatically processed and added to prospects.csv.';
                  successMsg.style.display = 'block';
                  
                  // Reset form
                  form.reset();
                  
                  // Hide message after 10 seconds
                  setTimeout(() => {{
                      successMsg.style.display = 'none';
                  }}, 10000);
              }}
              </script>
          </body>
          </html>'''

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(html)
          print('Generated index.html')
          "

      - name: Commit and push changes
        run: |
          git add tracking.csv feeds/ index.html *.xml || true
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "Update scraping results - $(date -u '+%Y-%m-%d %H:%M:%S UTC')" && \
             git push)
