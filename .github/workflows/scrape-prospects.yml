name: Scrape Prospect Articles

on:
  # Run weekly on Sunday at 10 PM UTC (ready for Monday morning outreach)
  schedule:
    - cron: '0 22 * * 0'

  # Allow manual triggering from GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Verify Firecrawl API key
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          if [ -z "$FIRECRAWL_API_KEY" ]; then
            echo "❌ Error: FIRECRAWL_API_KEY secret is not set in repository settings"
            echo ""
            echo "To fix this:"
            echo "1. Go to: https://github.com/swelbyboy/prospect-rss-feeds/settings/secrets/actions"
            echo "2. Click 'New repository secret'"
            echo "3. Name: FIRECRAWL_API_KEY"
            echo "4. Value: Your Firecrawl API key"
            echo "5. Click 'Add secret'"
            exit 1
          else
            echo "✅ FIRECRAWL_API_KEY secret is set"
          fi

      - name: Run scraper
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GITHUB_CI: "true"
          MAX_ARTICLES_PER_PROSPECT: 10
          SCRAPING_TIMEOUT: 60
        run: |
          python scraper.py

      - name: Generate index page
        run: |
          python -c "
          import csv
          from datetime import datetime

          # Read tracking data
          tracking_data = []
          try:
              with open('tracking.csv', 'r', encoding='utf-8') as f:
                  reader = csv.DictReader(f)
                  tracking_data = list(reader)
          except FileNotFoundError:
              pass

          # Generate index.html
          html = '''<!DOCTYPE html>
          <html lang=\"en\">
          <head>
              <meta charset=\"UTF-8\">
              <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
              <title>Prospect RSS Feeds</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 20px; max-width: 1200px; }
                  table { border-collapse: collapse; width: 100%; margin-bottom: 30px; }
                  th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
                  th { background-color: #f2f2f2; }
                  .success { color: green; }
                  .failed { color: red; }
                  .upload-cta {
                      background-color: #007bff;
                      color: white;
                      padding: 15px 30px;
                      border-radius: 6px;
                      text-decoration: none;
                      display: inline-block;
                      margin-bottom: 30px;
                      font-size: 16px;
                      font-weight: bold;
                      border: none;
                      cursor: pointer;
                  }
                  .upload-cta:hover {
                      background-color: #0056b3;
                  }
                  .upload-modal {
                      display: none;
                      position: fixed;
                      z-index: 1000;
                      left: 0;
                      top: 0;
                      width: 100%;
                      height: 100%;
                      background-color: rgba(0,0,0,0.5);
                  }
                  .modal-content {
                      background-color: #fefefe;
                      margin: 5% auto;
                      padding: 30px;
                      border: 1px solid #888;
                      width: 90%;
                      max-width: 600px;
                      border-radius: 8px;
                      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
                  }
                  .close {
                      color: #aaa;
                      float: right;
                      font-size: 28px;
                      font-weight: bold;
                      cursor: pointer;
                  }
                  .close:hover {
                      color: black;
                  }
                  .form-group {
                      margin-bottom: 20px;
                  }
                  .form-group label {
                      display: block;
                      margin-bottom: 8px;
                      font-weight: bold;
                  }
                  .form-group textarea {
                      width: 100%;
                      padding: 10px;
                      border: 1px solid #ddd;
                      border-radius: 4px;
                      box-sizing: border-box;
                      font-family: monospace;
                      min-height: 200px;
                  }
                  .form-help {
                      font-size: 12px;
                      color: #666;
                      margin-top: 5px;
                  }
                  .submit-btn {
                      background-color: #28a745;
                      color: white;
                      padding: 10px 20px;
                      border: none;
                      border-radius: 4px;
                      cursor: pointer;
                      font-size: 16px;
                  }
                  .submit-btn:hover {
                      background-color: #218838;
                  }
                  .message {
                      padding: 10px;
                      border-radius: 4px;
                      margin-top: 10px;
                      display: none;
                  }
                  .success-message {
                      background-color: #d4edda;
                      color: #155724;
                  }
                  .error-message {
                      background-color: #f8d7da;
                      color: #721c24;
                  }
              </style>
          </head>
          <body>
              <h1>Prospect RSS Feeds</h1>
              
              <button class=\"upload-cta\" onclick=\"openUploadModal()\">📤 Upload New Prospects</button>

              <div id=\"uploadModal\" class=\"upload-modal\">
                  <div class=\"modal-content\">
                      <span class=\"close\" onclick=\"closeUploadModal()\">&times;</span>
                      <h2>Upload New Prospects</h2>
                      <p>Upload a CSV file with columns: <strong>Prospect Name</strong> and <strong>Domain</strong></p>
                      <form id=\"csvForm\" onsubmit=\"submitCSV(event)\">
                          <div class=\"form-group\">
                              <label for=\"csvContent\">CSV Content:</label>
                              <textarea id=\"csvContent\" name=\"csvContent\" required placeholder=\"Prospect Name,Domain
TechCorp,techcorp.com
InnovateLabs,innovatelabs.io\"></textarea>
                              <div class=\"form-help\">Paste your CSV data here. Format: Prospect Name,Domain (one per line)</div>
                          </div>
                          <button type=\"submit\" class=\"submit-btn\">Submit</button>
                          <div id=\"message\" class=\"message\"></div>
                      </form>
                  </div>
              </div>

              <h2>Current Prospects</h2>
              <table>
                  <tr>
                      <th>Prospect Name</th>
                      <th>RSS Feed</th>
                      <th>Last Scrape Status</th>
                      <th>Last Scrape Timestamp</th>
                  </tr>
          '''

          for entry in tracking_data:
              company_name = entry.get('company_name', '')
              status = entry.get('status', '')
              rss_url = entry.get('rss_url', '')
              last_scrape_date = entry.get('last_scrape_date', '-')
              status_class = 'success' if status == 'success' else 'failed'
              rss_link = f'<a href=\"{rss_url}\">{rss_url}</a>' if rss_url else '-'
              html += f'        <tr><td>{company_name}</td><td>{rss_link}</td><td class=\"{status_class}\">{status}</td><td>{last_scrape_date}</td></tr>\n'

          html += f'''    </table>
              <p>Last updated: {datetime.now().strftime('%Y-%m-%d %H:%M:%S UTC')}</p>
              
              <script>
              function openUploadModal() {{
                  document.getElementById('uploadModal').style.display = 'block';
              }}
              
              function closeUploadModal() {{
                  document.getElementById('uploadModal').style.display = 'none';
                  document.getElementById('csvForm').reset();
                  document.getElementById('message').style.display = 'none';
              }}
              
              window.onclick = function(event) {{
                  const modal = document.getElementById('uploadModal');
                  if (event.target == modal) {{
                      closeUploadModal();
                  }}
              }}
              
              function submitCSV(event) {{
                  event.preventDefault();
                  const csvContent = document.getElementById('csvContent').value.trim();
                  
                  if (!csvContent) {{
                      showMessage('Please enter CSV content', 'error');
                      return;
                  }}
                  
                  // Create GitHub issue directly via API (no manual label selection needed)
                  // The label will be automatically created by the workflow if it doesn't exist
                  const repoOwner = 'swelbyboy';
                  const repoName = 'prospect-rss-feeds';
                  const issueTitle = 'Upload new prospects CSV';
                  const issueBody = `**CSV Content:**\n\n\`\`\`\n${csvContent}\n\`\`\`\n\n<!-- This issue will be automatically processed -->`;
                  
                  // Create issue URL with label pre-selected
                  const issueUrl = `https://github.com/${repoOwner}/${repoName}/issues/new?title=${encodeURIComponent(issueTitle)}&body=${encodeURIComponent(issueBody)}&labels=new-prospects-csv`;
                  
                  // Open in new window (will auto-create label if needed)
                  window.open(issueUrl, '_blank');
                  
                  showMessage('✅ Opening GitHub to create issue. The label will be created automatically. After you submit, prospects will be added automatically.', 'success');
                  
                  // Reset form after a delay
                  setTimeout(() => {{
                      document.getElementById('csvForm').reset();
                      closeUploadModal();
                  }}, 2000);
              }}
              
              function showMessage(text, type) {{
                  const messageDiv = document.getElementById('message');
                  messageDiv.textContent = text;
                  messageDiv.className = 'message ' + type + '-message';
                  messageDiv.style.display = 'block';
              }}
              </script>
          </body>
          </html>'''

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(html)
          print('Generated index.html')
          "

      - name: Commit and push changes
        run: |
          git add tracking.csv feeds/ index.html *.xml || true
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "Update scraping results - $(date -u '+%Y-%m-%d %H:%M:%S UTC')" && \
             git push)
