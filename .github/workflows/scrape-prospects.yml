name: Scrape Prospect Articles

on:
  # Run weekly on Sunday at 10 PM UTC (ready for Monday morning outreach)
  schedule:
    - cron: '0 22 * * 0'

  # Allow manual triggering from GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Verify Firecrawl API key
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          if [ -z "$FIRECRAWL_API_KEY" ]; then
            echo "❌ Error: FIRECRAWL_API_KEY secret is not set in repository settings"
            echo ""
            echo "To fix this:"
            echo "1. Go to: https://github.com/swelbyboy/prospect-rss-feeds/settings/secrets/actions"
            echo "2. Click 'New repository secret'"
            echo "3. Name: FIRECRAWL_API_KEY"
            echo "4. Value: Your Firecrawl API key"
            echo "5. Click 'Add secret'"
            exit 1
          else
            echo "✅ FIRECRAWL_API_KEY secret is set"
          fi

      - name: Run scraper
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GITHUB_CI: "true"
          MAX_ARTICLES_PER_PROSPECT: 10
          SCRAPING_TIMEOUT: 60
          PROSPECTS_CSV: "prospects/outreach_progress_tracker.csv"
        run: |
          python scripts/scraper.py

      - name: Generate index page
        run: |
          python scripts/generate_index.py

      - name: Update tracker with scraping results
        run: |
          python scripts/establish_tracker_truth.py

      - name: Commit tracking data to main
        run: |
          git add prospects/outreach_progress_tracker.csv prospects/tracking.csv prospects/current_feeds.txt index.html || true
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "Update scraping results - $(date -u '+%Y-%m-%d %H:%M:%S UTC')" && \
             git pull --rebase origin main && \
             git push)

      - name: Deploy feeds to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          feed_count=$(ls feeds/*.xml 2>/dev/null | wc -l)
          echo "Found $feed_count feeds to deploy"

          if [ "$feed_count" -eq 0 ]; then
            echo "⚠️  No feeds to deploy"
            exit 0
          fi

          git fetch origin gh-pages
          git worktree add gh-pages-dir origin/gh-pages

          cp feeds/*.xml gh-pages-dir/
          touch gh-pages-dir/.nojekyll

          cd gh-pages-dir
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add .
          git diff --staged --quiet || \
            (git commit -m "Deploy feeds to GitHub Pages - $(date -u '+%Y-%m-%d %H:%M:%S UTC')" && \
             git push origin gh-pages && \
             echo "✅ Feeds deployed to gh-pages")
